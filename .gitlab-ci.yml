stages:
  - test
  - build
  - deploy

.deploy:
  stage: deploy
  tags:
    - caila-ci
  needs:
    - build
  variables:
    NEXUS: null
    VERSION: null
  script:
    - echo "Deploying ${VERSION} version into ${NEXUS}.."
    - make build
    - uv run twine upload --repository ${NEXUS} --verbose ./dist/*.whl

test:
  stage: test
  image: python:3.12-slim
  services:
    - docker:24.0.5-dind
  tags:
    - docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "machine nexus.just-ai.com" > ~/.netrc
    - echo "login $NEXUS_USER" >> ~/.netrc
    - echo "password $NEXUS_PASSWORD" >> ~/.netrc
    - cat ~/.netrc
    - apt-get update && apt-get -y install make
    - apt-get update && apt-get -y --no-install-recommends install bash docker-cli docker-buildx libatomic1
    - pip install uv
    - make venv
  script:
    - make generate test

build:
  stage: build
  tags:
    - caila-ci
  needs:
    - test
  script:
    - make build

deploy_open:
  extends: .deploy
  variables:
    NEXUS: nexus-open
    VERSION: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always

deploy_private:
  extends: .deploy
  variables:
    NEXUS: nexus
    VERSION: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "v2"'
      changes:
        - "src/**/*"
        - "api-specs/*"
        - "build-scripts/*"
      when: always
