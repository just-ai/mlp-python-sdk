stages:
  - test
  - build
  - update_sdk_version
  - deploy

.deploy:
  stage: deploy
  tags:
    - caila-ci
  needs:
    - build
  variables:
    NEXUS: null
    VERSION: null
  script:
    - echo "Deploying ${VERSION} version into ${NEXUS}.."
    - make build
    - uv run twine upload --repository ${NEXUS} --verbose ./dist/*.whl

test:
  stage: test
  image: python:3.12-slim
  services:
    - docker:24.0.5-dind
  tags:
    - docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "machine nexus.just-ai.com" > ~/.netrc
    - echo "login $NEXUS_USER" >> ~/.netrc
    - echo "password $NEXUS_PASSWORD" >> ~/.netrc
    - cat ~/.netrc
    - apt-get update && apt-get -y install make
    - apt-get update && apt-get -y --no-install-recommends install bash docker-cli docker-buildx libatomic1
    - pip install uv
    - make venv
  script:
    - make generate test

build:
  stage: build
  tags:
    - caila-ci
  needs:
    - test
  script:
    - make build

deploy_open:
  extends: .deploy
  variables:
    NEXUS: nexus-open
    VERSION: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always

deploy_private:
  extends: .deploy
  variables:
    NEXUS: nexus
    VERSION: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "v2"'
      changes:
        - src/**/*
        - api-specs/*
        - build-scripts/*
        - pyproject.toml
        - uv.lock
      when: always

update_sdk_version:
  stage: update_sdk_version
  tags:
    - caila-ci
  needs:
    - test
    - build
  script:
    - git remote set-url origin https://gitlab-ci-token:${CI_TOKEN}@gitlab.just-ai.com/${CI_PROJECT_PATH}.git
    - python3.11 -m pip install -U uv==0.7.11
    - echo "Описание коммита - $CI_COMMIT_MESSAGE"
    # README: https://docs.astral.sh/uv/reference/cli/#uv-version--bump
    - |
      if [[ "$CI_COMMIT_MESSAGE" == *"major"* ]]; then
        uv version --bump major
      elif [[ "$CI_COMMIT_MESSAGE" == *"minor"* ]]; then
        uv version --bump minor
      elif [[ "$CI_COMMIT_MESSAGE" == *"patch"* ]]; then
        uv version --bump patch
      else
        echo "No version bump specified. Skipping version update."
        exit 0
      fi

    - git add pyproject.toml uv.lock
    - export UV_VERSION=$(uv version)
    - git commit -m "New version - '$UV_VERSION'"
    - git push origin HEAD:$CI_COMMIT_BRANCH
  rules:
    # запускать стейдж только, если коммит начинается с перечисленных ниже слов с двоеточием 
    # например, `patch: fix params`
    - if: '$CI_COMMIT_MESSAGE =~ "\b(major|minor|patch):"'
