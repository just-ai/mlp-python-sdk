components:
  schemas:
    BooleanConstant:
      required:
      - name
      - type
      - value
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelConstant'
      - type: object
        properties:
          value:
            type: boolean
    BooleanVariable:
      required:
      - name
      - required
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelVariable'
      - type: object
        properties:
          default:
            type: boolean
    EnumConstant:
      required:
      - name
      - type
      - value
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelConstant'
      - type: object
        properties:
          value:
            type: array
            items:
              type: string
    EnumVariable:
      required:
      - name
      - required
      - type
      - values
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelVariable'
      - type: object
        properties:
          values:
            type: array
            items:
              type: string
          default:
            type: string
    IntegerConstant:
      required:
      - name
      - type
      - value
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelConstant'
      - type: object
        properties:
          value:
            type: integer
            format: int64
    IntegerVariable:
      required:
      - name
      - required
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelVariable'
      - type: object
        properties:
          default:
            type: integer
            format: int64
          min:
            type: integer
            format: int64
          max:
            type: integer
            format: int64
    ModelConstant:
      required:
      - name
      - type
      - value
      type: object
      properties:
        name:
          type: string
        value:
          type: object
        type:
          type: string
      discriminator:
        propertyName: type
    ModelParametersDto:
      required:
      - constants
      - variables
      type: object
      properties:
        constants:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/BooleanConstant'
            - $ref: '#/components/schemas/EnumConstant'
            - $ref: '#/components/schemas/IntegerConstant'
            - $ref: '#/components/schemas/NumberConstant'
            - $ref: '#/components/schemas/StringConstant'
        variables:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/BooleanVariable'
            - $ref: '#/components/schemas/EnumVariable'
            - $ref: '#/components/schemas/IntegerVariable'
            - $ref: '#/components/schemas/NumberVariable'
            - $ref: '#/components/schemas/StringVariable'
    ModelVariable:
      required:
      - name
      - required
      - type
      type: object
      properties:
        name:
          type: string
        default:
          type: object
        type:
          type: string
        required:
          type: boolean
      discriminator:
        propertyName: type
    NumberConstant:
      required:
      - name
      - type
      - value
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelConstant'
      - type: object
        properties:
          value:
            type: number
            format: double
    NumberVariable:
      required:
      - name
      - required
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelVariable'
      - type: object
        properties:
          default:
            type: number
            format: double
          min:
            type: number
            format: double
          max:
            type: number
            format: double
    StringConstant:
      required:
      - name
      - type
      - value
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelConstant'
      - type: object
        properties:
          value:
            type: string
    StringVariable:
      required:
      - name
      - required
      - type
      type: object
      allOf:
      - $ref: '#/components/schemas/ModelVariable'
      - type: object
        properties:
          default:
            type: string
          minLength:
            type: integer
            format: int32
          maxLength:
            type: integer
            format: int32
    UpdateLlmModelsData:
      type: object
      properties:
        displayName:
          maxLength: 100
          minLength: 0
          type: string
        parameters:
          $ref: '#/components/schemas/ModelParametersDto'
    LlmModelsData:
      required:
      - createdAt
      - displayName
      - name
      - parameters
      - provider
      - updatedAt
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderRefData'
        parameters:
          $ref: '#/components/schemas/ModelParametersDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProviderRefData:
      required:
      - displayName
      - name
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
    PriceMarkupUpdateRequest:
      required:
      - coefficient
      type: object
      properties:
        coefficient:
          maximum: 100.0
          exclusiveMaximum: false
          minimum: 1.0
          exclusiveMinimum: false
          type: number
    PriceMarkupData:
      required:
      - coefficient
      type: object
      properties:
        id:
          type: integer
          format: int64
        coefficient:
          maximum: 100.0
          exclusiveMaximum: false
          minimum: 1.0
          exclusiveMinimum: false
          type: number
        clientId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExchangeRateUpsertRequest:
      required:
      - rate
      type: object
      properties:
        rate:
          type: number
    ExchangeRateData:
      required:
      - fromCurrency
      - rate
      - toCurrency
      type: object
      properties:
        fromCurrency:
          type: string
        toCurrency:
          type: string
        rate:
          type: number
    ServiceFilter:
      required:
      - accountName
      type: object
      properties:
        accountName:
          type: string
        serviceName:
          type: string
    SpendingLimit:
      required:
      - interval
      - maxAmount
      type: object
      properties:
        maxAmount:
          type: integer
          format: int64
        interval:
          type: string
          enum:
          - MINUTE
          - HOUR
          - DAY
          - MONTH
    TokenRestrictionsData:
      type: object
      properties:
        maxRequestSizeBytes:
          type: integer
          format: int64
        maxRequestsPerMinute:
          type: integer
          format: int64
        spendingLimits:
          type: array
          items:
            $ref: '#/components/schemas/SpendingLimit'
        allowedServicesFilter:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ServiceFilter'
        allowedAdapterModelsFilter:
          uniqueItems: true
          type: array
          items:
            type: string
    UpdateAccessTokenData:
      required:
      - permissions
      type: object
      properties:
        ttlMinutes:
          type: integer
          format: int64
        permissions:
          uniqueItems: true
          type: array
          items:
            type: string
        restrictions:
          $ref: '#/components/schemas/TokenRestrictionsData'
        jayGuardMaskingKey:
          type: string
        emailsForNotifications:
          type: array
          items:
            type: string
        keepAvailableOnLimitChange:
          type: boolean
    AccessTokenData:
      required:
      - creationDate
      - id
      - keepAvailableOnLimitChange
      - name
      - permissions
      - token
      type: object
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
        name:
          type: string
        creationDate:
          type: string
        ttlMinutes:
          type: integer
          format: int64
        permissions:
          type: array
          items:
            type: string
        restrictions:
          $ref: '#/components/schemas/TokenRestrictionsData'
        jayGuardMaskingKey:
          type: string
        emailsForNotifications:
          type: array
          items:
            type: string
        keepAvailableOnLimitChange:
          type: boolean
    ReadUINotificationRequest:
      required:
      - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    DaemonSetConfigData:
